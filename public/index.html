<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food Calendar</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #fafaf9; --ink: #1a202c; --muted: #718096; --line: #e2e8f0;
    --accent: #2b6cb0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         color: var(--ink); background: var(--bg); }
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: white; border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; flex-wrap: wrap;
    align-items: center; gap: 12px;
  }
  .brand { font-weight: 700; font-size: 18px; margin-right: 8px; }
  nav.days { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  nav.days button {
    border: 1px solid var(--line); background: white; padding: 6px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  nav.days button.active { background: var(--accent); color: white; border-color: var(--accent); }
  nav.days button .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-left: 4px; background: var(--muted); vertical-align: middle;
  }
  nav.days button .dot.full { background: #38a169; }
  nav.days button .dot.partial { background: #d69e2e; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button, .controls a {
    border: 1px solid var(--line); background: white; padding: 6px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: inherit;
    text-decoration: none;
  }
  .view-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .view-toggle button { border: 0; border-radius: 0; padding: 6px 10px; background: white; }
  .view-toggle button.active { background: var(--accent); color: white; }

  main { padding: 16px; max-width: 1200px; margin: 0 auto; }

  /* Day view */
  .meal-block { background: white; border: 1px solid var(--line); border-radius: 12px;
                padding: 14px 16px; margin-bottom: 14px; }
  .meal-block header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .meal-block h2 { margin: 0; font-size: 16px; text-transform: uppercase;
                   letter-spacing: .04em; color: var(--muted); }
  .mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .mode-toggle button { border: 0; border-radius: 0; padding: 4px 10px; background: white; font-size: 12px; }
  .mode-toggle button.active { background: var(--accent); color: white; }
  .source-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px;
                 background: var(--line); color: var(--ink); }
  .source-chip.rule { background: #fefcbf; color: #744210; }
  .source-chip.override { background: #c6f6d5; color: #22543d; }

  .shared-row, .indiv-row { margin-top: 10px; display: grid; gap: 8px; }
  .shared-row { grid-template-columns: 1fr; }
  .indiv-row { grid-template-columns: 1fr; }
  .shared-row label, .indiv-row label { font-size: 12px; color: var(--muted); }
  .options-list { display: grid; gap: 6px; }
  .option-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
  .option-row input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
                      font-size: 14px; width: 100%; background: white; }
  .option-row button { border: 1px solid var(--line); background: white; border-radius: 8px;
                       padding: 6px 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .add-option { border: 1px dashed var(--line); background: white; border-radius: 8px;
                padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--muted);
                align-self: start; justify-self: start; }
  .add-option:hover { color: var(--accent); border-color: var(--accent); }
  .options-display { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .options-display .opt { font-size: 12px; padding: 2px 8px; border-radius: 999px;
                          background: var(--line); color: var(--ink); }
  .eaters { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .eater-row { display: flex; align-items: center; gap: 8px; }
  .eaters .chip { display: inline-flex; align-items: center; gap: 6px;
                  padding: 4px 10px; border-radius: 999px; cursor: pointer;
                  border: 1px solid var(--line); user-select: none; font-size: 13px; }
  .eaters .chip.on { color: #1a202c; }
  .eaters .chip.off { color: var(--muted); opacity: .7; }

  .indiv-list { display: grid; gap: 8px; margin-top: 6px; }
  .indiv-user { display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; gap: 10px; }
  .indiv-user .name {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; color: #1a202c;
    text-align: center; min-width: 64px;
  }
  .indiv-user input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
                      font-size: 14px; background: white; }
  .meal-actions { display: flex; gap: 8px; margin-top: 10px; }
  .meal-actions button { font-size: 12px; padding: 6px 10px; border: 1px solid var(--line);
                          background: white; border-radius: 8px; cursor: pointer; }
  .meal-actions button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .meal-actions button.danger { color: #c53030; border-color: #fed7d7; }
  .meal-meta { display: flex; gap: 6px; margin-top: 8px; }
  .meal-meta input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
                     font-size: 13px; flex: 1; }

  /* Week grid view */
  .week-grid { display: grid; grid-template-columns: 110px repeat(7, 1fr); gap: 6px; }
  .week-grid .gh, .week-grid .gc { background: white; border: 1px solid var(--line);
                                    border-radius: 8px; padding: 8px; font-size: 12px; min-height: 80px; }
  .week-grid .gh { background: #edf2f7; font-weight: 600; text-align: center; }
  .week-grid .gc .meal-name { font-size: 11px; color: var(--muted); text-transform: uppercase;
                              letter-spacing: .04em; margin-bottom: 4px; }
  .week-grid .gc .dish { font-size: 13px; line-height: 1.3; }
  .week-grid .gc .users { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
  .week-grid .gc .users .u { width: 10px; height: 10px; border-radius: 50%; }

  .saved-flash {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 6px 12px; border-radius: 8px;
    font-size: 12px; opacity: 0; transition: opacity .2s;
  }
  .saved-flash.show { opacity: 1; }

  .cost-badge {
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: #ebf8ff; border: 1px solid #90cdf4;
    padding: 2px 8px; border-radius: 999px;
  }

  .week-total {
    margin-top: 16px; padding: 12px 16px; background: #ebf8ff;
    border: 1px solid #90cdf4; border-radius: 10px;
    font-size: 14px; font-weight: 600; color: #2b6cb0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .week-total .label { font-size: 12px; font-weight: 500; text-transform: uppercase;
                        letter-spacing: .05em; color: #4a5568; }
  .week-total .amount { font-size: 20px; }
  .week-total .breakdown { font-size: 11px; color: #718096; margin-top: 2px; }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Food Calendar</span>
  <nav class="days" id="days-nav"></nav>
  <div class="controls">
    <button id="prev-week">‹ Prev</button>
    <button id="today-btn">Today</button>
    <button id="next-week">Next ›</button>
    <div class="view-toggle">
      <button id="view-day" class="active">Day</button>
      <button id="view-week">Week</button>
    </div>
  </div>
</header>

<main>
  <div id="day-view"></div>
  <div id="week-view" style="display:none"></div>
</main>

<div id="flash" class="saved-flash">Saved</div>

<script>
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MEALS = ['breakfast','lunch','dinner'];
const MEAL_LABELS = { breakfast:'Breakfast', lunch:'Lunch', dinner:'Dinner' };

const state = {
  view: 'day',
  weekStart: null,   // YYYY-MM-DD (Monday)
  users: [],
  week: null,
  selectedDayIndex: 0,
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function startOfWeek(d) {
  const day = (d.getDay() + 6) % 7;
  const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  copy.setDate(copy.getDate() - day);
  return copy;
}
function addDays(d, n) {
  const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  copy.setDate(copy.getDate() + n);
  return copy;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function loadUsers() {
  state.users = await api('/api/users');
}
async function loadWeek() {
  state.week = await api(`/api/week?start=${state.weekStart}`);
}

function renderDaysNav() {
  const nav = $('#days-nav');
  nav.innerHTML = '';
  state.week.days.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.index = String(i);
    const d = new Date(day.date + 'T00:00:00');
    const label = `${DAY_NAMES[i]} ${d.getMonth()+1}/${d.getDate()}`;
    btn.innerHTML = `${label}<span class="dot" data-dot="${i}"></span>`;
    if (i === state.selectedDayIndex) btn.classList.add('active');
    btn.onclick = () => { state.selectedDayIndex = i; state.view = 'day'; render(); };
    nav.appendChild(btn);
  });
  // Update dot indicators
  state.week.days.forEach((day, i) => {
    const dot = nav.querySelector(`[data-dot="${i}"]`);
    if (!dot) return;
    let hasAny = false, hasAll = true;
    for (const meal of MEALS) {
      const cell = day.cells[meal];
      if (cell.source === 'override') { hasAny = true; }
      else if (cell.source === 'rule') { hasAny = true; }
      else { hasAll = false; }
    }
    if (hasAll) dot.classList.add('full');
    else if (hasAny) dot.classList.add('partial');
  });
}

function userChip(user, on) {
  return `<span class="chip ${on ? 'on' : 'off'}" data-user="${user.id}"
    style="${on ? `background:${user.color};border-color:${user.color}` : ''}">${user.display_name}</span>`;
}

function readOptions(container) {
  if (!container) return [];
  return [...container.querySelectorAll('.option-row input')]
    .map(i => i.value.trim()).filter(Boolean);
}

function optionsEditorHtml(options, placeholder) {
  const opts = (options && options.length) ? options : [''];
  const rows = opts.map(o =>
    `<div class="option-row">
       <input value="${escapeAttr(o)}" placeholder="${escapeAttr(placeholder || 'dish option')}" />
       <button type="button" class="rm-opt" title="Remove">×</button>
     </div>`).join('');
  return `<div class="options-list">${rows}</div>
          <button type="button" class="add-option">+ option</button>`;
}

function wireOptionsEditor(root) {
  root.querySelectorAll('.add-option').forEach(btn => {
    btn.onclick = () => {
      const list = btn.previousElementSibling;
      const row = document.createElement('div');
      row.className = 'option-row';
      row.innerHTML = `<input placeholder="another option" /><button type="button" class="rm-opt" title="Remove">×</button>`;
      list.appendChild(row);
      wireRowRemove(row);
      row.querySelector('input').focus();
    };
  });
  root.querySelectorAll('.option-row').forEach(wireRowRemove);
}

function wireRowRemove(row) {
  const btn = row.querySelector('.rm-opt');
  if (!btn) return;
  btn.onclick = () => {
    const list = row.parentElement;
    if (list.children.length > 1) row.remove();
    else row.querySelector('input').value = '';
  };
}

function renderDayView() {
  const wrap = $('#day-view');
  const day = state.week.days[state.selectedDayIndex];
  const d = new Date(day.date + 'T00:00:00');
  const headerHtml = `<h1 style="margin:0 0 12px;font-size:22px">${DAY_FULL[state.selectedDayIndex]}, ${d.toLocaleDateString(undefined,{month:'long',day:'numeric'})}</h1>`;

  const blocks = MEALS.map(meal => renderMealBlock(day.date, meal, day.cells[meal])).join('');
  wrap.innerHTML = headerHtml + blocks;

  // Wire up interactions
  $$('.meal-block').forEach(block => {
    const date = block.dataset.date;
    const meal = block.dataset.meal;
    const toggleBtns = block.querySelectorAll('.mode-toggle button');
    toggleBtns.forEach(b => b.onclick = () => {
      block.dataset.mode = b.dataset.mode;
      toggleBtns.forEach(x => x.classList.toggle('active', x === b));
      block.querySelectorAll('.shared-row,.indiv-row').forEach(r => r.style.display = 'none');
      block.querySelector(`.${b.dataset.mode}-row`).style.display = '';
    });
    block.querySelectorAll('.eaters .chip').forEach(c => c.onclick = () => {
      c.classList.toggle('on'); c.classList.toggle('off');
    });
    const saveBtn = block.querySelector('.save-btn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        const mode = block.dataset.mode;
        const notes = block.querySelector('input.notes')?.value || '';
        const recipe_url = block.querySelector('input.recipe_url')?.value || '';
        const entries = [];
        let body;
        if (mode === 'shared') {
          const options = readOptions(block.querySelector('.shared-row .options-list'));
          block.querySelectorAll('.eaters .chip').forEach(c => {
            const row = c.closest('.eater-row');
            const costEl = row ? row.querySelector('.cost') : null;
            const cost = costEl && costEl.value.trim() ? parseFloat(costEl.value) : null;
            entries.push({ user_id: c.dataset.user, options: [], eating: c.classList.contains('on') ? 1 : 0, cost });
          });
          body = { mode, options, name: options[0] || '', notes, recipe_url, entries, source: 'ui' };
        } else {
          block.querySelectorAll('.indiv-user').forEach(u => {
            const opts = readOptions(u.querySelector('.options-list'));
            const costEl = u.querySelector('input.cost');
            const cost = costEl && costEl.value.trim() ? parseFloat(costEl.value) : null;
            entries.push({ user_id: u.dataset.user, options: opts, name: opts[0] || '', eating: 1, cost });
          });
          body = { mode, options: [], name: entries[0]?.name || '', notes, recipe_url, entries, source: 'ui' };
        }
        await api(`/api/meals/${date}/${meal}`, { method: 'PUT', body: JSON.stringify(body) });
        await loadWeek();
        flash('Saved');
        render();
      };
    }
    const clearBtn = block.querySelector('.clear-btn');
    if (clearBtn) {
      clearBtn.onclick = async () => {
        await api(`/api/meals/${date}/${meal}`, { method: 'DELETE' });
        await loadWeek();
        flash('Override cleared — rule re-emerges');
        render();
      };
    }
    const repeatBtn = block.querySelector('.repeat-btn');
    if (repeatBtn) {
      repeatBtn.onclick = async () => {
        const dow = (new Date(date + 'T00:00:00').getDay() + 6) % 7;
        const mode = block.dataset.mode;
        const notes = block.querySelector('input.notes')?.value || '';
        const recipe_url = block.querySelector('input.recipe_url')?.value || '';
        if (mode === 'shared') {
          const options = readOptions(block.querySelector('.shared-row .options-list'));
          if (!options.length) { flash('Nothing to repeat'); return; }
          const eaters = [];
          block.querySelectorAll('.eater-row').forEach(row => {
            const chip = row.querySelector('.chip');
            if (chip.classList.contains('on')) eaters.push({ user_id: chip.dataset.user });
          });
          // Shared repeat: create one rule per eater with their individual cost from meal_entries
          for (const e of eaters) {
            const row = [...block.querySelectorAll('.eater-row')].find(r => r.querySelector('.chip').dataset.user === e.user_id);
            const costEl = row ? row.querySelector('input.cost') : null;
            const cost = costEl && costEl.value.trim() ? parseFloat(costEl.value) : null;
            await api('/api/rules', { method: 'POST',
              body: JSON.stringify({ mode: 'individual', weekday: dow, meal, user_id: e.user_id, options, name: options[0], notes, recipe_url, cost }) });
          }
          flash('Recurring rules saved');
        } else {
          const usersWithOptions = [];
          block.querySelectorAll('.indiv-user').forEach(u => {
            const opts = readOptions(u.querySelector('.options-list'));
            if (opts.length) {
              const costEl = u.querySelector('input.cost');
              const cost = costEl && costEl.value.trim() ? parseFloat(costEl.value) : null;
              usersWithOptions.push({ user_id: u.dataset.user, options: opts, name: opts[0], cost });
            }
          });
          if (!usersWithOptions.length) { flash('Nothing to repeat'); return; }
          for (const u of usersWithOptions) {
            await api('/api/rules', { method: 'POST',
              body: JSON.stringify({ mode: 'individual', weekday: dow, meal, user_id: u.user_id, options: u.options, name: u.name, cost: u.cost }) });
          }
          flash('Recurring rules saved');
        }
        await loadWeek();
        render();
      };
    }
  });

  // Wire up option editors on every block after rendering
  $$('.meal-block').forEach(b => wireOptionsEditor(b));
}

function renderMealBlock(date, meal, cell) {
  const sourceChip = cell.source === 'rule' ? '<span class="source-chip rule">↻ from rule</span>'
    : cell.source === 'override' ? '<span class="source-chip override">override</span>' : '';
  const mode = cell.mode === 'empty' ? 'shared' : cell.mode;
  const sharedOptions = (cell.options && cell.options.length)
    ? cell.options
    : (cell.mode === 'shared' && cell.name ? [cell.name] : []);
  const eaters = state.users.map(u => {
    const entry = (cell.entries || []).find(e => e.user_id === u.id) || { eating: 0, cost: null };
    const costVal = entry.cost != null ? Number(entry.cost).toFixed(2) : '';
    const chip = `<span class="chip ${entry.eating ? 'on' : 'off'}" data-user="${u.id}"
      style="${entry.eating ? `background:${u.color};border-color:${u.color}` : ''}">${u.display_name}</span>`;
    return `<div class="eater-row">
      ${chip}
      <input class="cost" type="number" min="0" step="0.01" value="${costVal}" placeholder="cost $" style="width:85px" />
    </div>`;
  }).join('');
  const indiv = state.users.map(u => {
    const entry = (cell.entries || []).find(e => e.user_id === u.id) || { name: '', options: [], cost: null };
    const opts = (entry.options && entry.options.length)
      ? entry.options
      : (entry.name ? [entry.name] : []);
    const html = optionsEditorHtml(opts, `${u.display_name}'s meal`);
    const costVal = entry.cost != null ? Number(entry.cost).toFixed(2) : '';
    return `<div class="indiv-user" data-user="${u.id}">
      <span class="name" style="background:${u.color}">${u.display_name}</span>
      <div class="user-options">${html}</div>
      <input class="cost" type="number" min="0" step="0.01" value="${costVal}" placeholder="cost $" style="width:90px" />
    </div>`;
  }).join('');

  return `<section class="meal-block" data-date="${date}" data-meal="${meal}" data-mode="${mode}">
    <header>
      <h2>${MEAL_LABELS[meal]}</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${sourceChip}
        ${cell.cost != null ? `<span class="cost-badge">$${Number(cell.cost).toFixed(2)}</span>` : ''}
        <div class="mode-toggle">
          <button data-mode="shared" class="${mode==='shared'?'active':''}">Shared</button>
          <button data-mode="individual" class="${mode==='individual'?'active':''}">Individual</button>
        </div>
      </div>
    </header>

    <div class="shared-row" style="display:${mode==='shared'?'block':'none'}">
      <label>Options (one row per dish alternative)</label>
      ${optionsEditorHtml(sharedOptions, 'shared dish')}
      <label style="margin-top:8px">Eating</label>
      <div class="eaters">${eaters}</div>
    </div>

    <div class="indiv-row" style="display:${mode==='individual'?'block':'none'}">
      <div class="indiv-list">${indiv}</div>
    </div>

    <div class="meal-meta">
      <input class="notes" value="${escapeAttr(cell.notes || '')}" placeholder="notes (optional)" />
      <input class="recipe_url" value="${escapeAttr(cell.recipe_url || '')}" placeholder="recipe URL (optional)" />
    </div>

    <div class="meal-actions">
      <button class="primary save-btn">Save</button>
      <button class="repeat-btn">Repeat weekly</button>
      ${cell.source === 'override' ? '<button class="danger clear-btn">Clear override</button>' : ''}
    </div>
  </section>`;
}

function escapeAttr(s) { return String(s==null?'':s).replace(/"/g,'&quot;'); }

function renderWeekView() {
  if (!state.week) return;
  const wrap = $('#week-view');
  const users = state.users;
  const joinOpts = (opts, fallback) => {
    if (opts && opts.length) return opts.join(' or ');
    return fallback || '';
  };
  const truncate = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + '…' : s);
  const rows = MEALS.map(meal => {
    let html = `<div class="gh">${MEAL_LABELS[meal]}</div>`;
    state.week.days.forEach((day, i) => {
      const cell = day.cells[meal];
      let summary = '—';
      if (cell.mode === 'shared') {
        summary = truncate(joinOpts(cell.options, cell.name), 40) || '—';
      } else if (cell.mode === 'individual') {
        const filled = (cell.entries || []).filter(e => (e.options && e.options.length) || e.name);
        if (filled.length === 1) {
          const e = filled[0];
          summary = truncate(joinOpts(e.options, e.name), 40);
        } else if (filled.length > 1) {
          summary = `${filled.length} dishes`;
        }
      }
      const dots = users.map(u => {
        const e = (cell.entries || []).find(x => x.user_id === u.id) || { eating: 0, name: '', options: [] };
        const on = cell.mode === 'shared' ? e.eating : ((e.options && e.options.length) || e.name ? 1 : 0);
        return `<span class="u" style="background:${u.color};opacity:${on?1:.25}"></span>`;
      }).join('');
      const chip = cell.source === 'rule' ? '<span class="source-chip rule">↻</span>'
        : cell.source === 'override' ? '<span class="source-chip override">●</span>' : '';
      html += `<div class="gc" data-day="${i}" data-meal="${meal}" style="cursor:pointer">
        <div class="meal-name">${MEAL_LABELS[meal]} ${chip}</div>
        <div class="dish">${escapeAttr(summary)}</div>
        <div class="users">${dots}</div>
      </div>`;
    });
    return html;
  }).join('');
  const headerRow = '<div class="gh"></div>' + state.week.days.map((d,i) => {
    const dt = new Date(d.date + 'T00:00:00');
    return `<div class="gh">${DAY_NAMES[i]}<br><span style="font-weight:normal;font-size:11px">${dt.getMonth()+1}/${dt.getDate()}</span></div>`;
  }).join('');
  wrap.innerHTML = `<div class="week-grid">${headerRow}${rows}</div>`;
  // Weekly cost total
  let totalCost = 0;
  let slotCost = 0, entryCost = 0;
  state.week.days.forEach(d => {
    Object.values(d.cells).forEach(cell => {
      if (cell.cost != null) slotCost += cell.cost;
      (cell.entries || []).forEach(e => { if (e.cost != null) entryCost += e.cost; });
    });
  });
  const existingTotal = wrap.querySelector('.week-total');
  if (existingTotal) existingTotal.remove();
  // Use entry-level costs (per-person) as the authoritative total — avoids double-counting
  // shared meals (slot cost == sum of entry costs). Slot costs shown for context only.
  if (entryCost > 0) {
    const totalEl = document.createElement('div');
    totalEl.className = 'week-total';
    const parts = [];
    if (slotCost > 0) parts.push(`${slotCost.toFixed(2)} shared');
    if (entryCost > 0) parts.push(`${entryCost.toFixed(2)} total`);
    totalEl.innerHTML = `<div><div class="label">Weekly cost estimate</div><div class="breakdown">${parts.join(' + ') || 'meals with cost'}</div></div><div class="amount">$${entryCost.toFixed(2)}</div>`;
    wrap.appendChild(totalEl);
  }
  wrap.querySelectorAll('.gc').forEach(c => c.onclick = () => {
    state.selectedDayIndex = Number(c.dataset.day);
    state.view = 'day';
    render();
  });
}

function flash(msg) {
  const el = $('#flash');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1400);
}

function render() {
  renderDaysNav();
  if (state.view === 'day') {
    $('#day-view').style.display = '';
    $('#week-view').style.display = 'none';
    $('#view-day').classList.add('active');
    $('#view-week').classList.remove('active');
    renderDayView();
  } else {
    $('#day-view').style.display = 'none';
    $('#week-view').style.display = '';
    $('#view-week').classList.add('active');
    $('#view-day').classList.remove('active');
    renderWeekView();
  }
}

async function init() {
  await loadUsers();
  const now = new Date();
  state.weekStart = isoDate(startOfWeek(now));
  await loadWeek();
  state.selectedDayIndex = (now.getDay() + 6) % 7;
  render();

  $('#prev-week').onclick = async () => {
    state.weekStart = isoDate(addDays(new Date(state.weekStart + 'T00:00:00'), -7));
    await loadWeek(); render();
  };
  $('#next-week').onclick = async () => {
    state.weekStart = isoDate(addDays(new Date(state.weekStart + 'T00:00:00'), 7));
    await loadWeek(); render();
  };
  $('#today-btn').onclick = async () => {
    state.weekStart = isoDate(startOfWeek(new Date()));
    state.selectedDayIndex = (new Date().getDay() + 6) % 7;
    await loadWeek(); render();
  };
  $('#view-day').onclick = () => { state.view = 'day'; render(); };
  $('#view-week').onclick = () => { state.view = 'week'; render(); };
}

init().catch(err => {
  console.error('init failed:', err);
  document.body.innerHTML = `<pre style="padding:20px;color:#c53030;white-space:pre-wrap">UI error: ${err.message}\n\nServer is at http://localhost:3300 (or whatever PORT was set). Reload will retry.</pre>`;
});
</script>
</body>
</html>
